name: ci

on:
  pull_request:
    branches:
      - main
      - release
      - refactor/v3
  push:
    branches:
      - main
  merge_group:
    branches:
      - main

# cancel in-progress runs on new commits to same PR (gitub.event.number)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: 🔠 Lint project
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: lts/*
          sfw: true
          # root only, no scripts
          run-install: |
            - args: ['--filter', '.', '--ignore-scripts']

      - name: 🔠 Lint project
        run: vp run lint

  typecheck:
    name: 🔎 Typecheck project
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: lts/*
          cache: true
          sfw: true

      - name: 🔼 Generate Prisma Client
        run: vp run prisma:generate

      - name: 🔎 Typecheck project
        run: vp run typecheck

  unit:
    name: 🧪 Unit tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      # Match package.json test scripts; CI calls `vp test` directly.
      TEST: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: lts/*
          cache: true
          sfw: true

      - name: 🧪 Unit tests
        run: vp test --project unit --coverage --reporter=default --reporter=junit --outputFile=test-report.junit.xml

      - parallel:
          - name: ⬆︎ Upload test results to Codecov
            if: ${{ !cancelled() }}
            uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
            with:
              disable_search: true
              files: test-report.junit.xml
              flags: unit
              report_type: test_results
            env:
              CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

          - name: ⬆︎ Upload coverage reports to Codecov
            if: ${{ !cancelled() }}
            uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
            with:
              disable_search: true
              files: coverage/clover.xml
              flags: unit
            env:
              CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test:
    name: 🧪 Component tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      # Match package.json test scripts; CI calls `vp test` directly.
      TEST: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: lts/*
          cache: true
          sfw: true

      - name: 🌐 Install browser
        run: vp exec playwright install --with-deps chromium-headless-shell

      - name: 🔼 Generate Prisma Client
        run: vp run prisma:generate

      # One Chromium session does not outlive the whole suite: after some 80 of the
      # 118 files it drops the connection (`Browser connection was closed while
      # running tests`) with every assertion so far passing. So the files run in
      # shards, each in a browser of its own, one after the other, and the blob
      # reports merge into the one JUnit and coverage report Codecov reads. A shard
      # the provider still drops (`route.fulfill: Route is already handled!`) runs
      # once more on its own.
      - name: 🧪 Component tests
        run: |
          set -euo pipefail
          shards=4
          max_attempts=2
          failed=0
          for shard in $(seq 1 "${shards}"); do
            attempt=1
            until vp test --project nuxt --coverage --shard="${shard}/${shards}" --reporter=blob; do
              if [ "${attempt}" -ge "${max_attempts}" ]; then
                echo "::error::Component tests shard ${shard}/${shards} failed ${max_attempts} times"
                failed=1
                break
              fi
              echo "::warning::Component tests shard ${shard}/${shards} failed (attempt ${attempt}/${max_attempts}); retrying after Vitest browser flake"
              attempt=$((attempt + 1))
              sleep 5
            done
          done
          # Merged even after a failure, so Codecov still gets the results of the run.
          vp test --project nuxt --mergeReports --coverage --reporter=default --reporter=junit --outputFile=test-report.junit.xml || failed=1
          exit "${failed}"
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - parallel:
          - name: ⬆︎ Upload test results to Codecov
            if: ${{ !cancelled() }}
            uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
            with:
              disable_search: true
              files: test-report.junit.xml
              flags: component
              report_type: test_results
            env:
              CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

          - name: ⬆︎ Upload coverage reports to Codecov
            if: ${{ !cancelled() }}
            uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
            with:
              disable_search: true
              files: coverage/clover.xml
              flags: component
            env:
              CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  browser:
    name: 🖥️ Browser tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: lts/*
          cache: true
          sfw: true

      - name: 🔼 Generate Prisma Client
        run: vp run prisma:generate

      - name: 🏗️ Build project
        run: vp run build:test
        env:
          VALIDATE_HTML: true
          NODE_OPTIONS: --max-old-space-size=4096
          NUXT_PUBLIC_SITE_URL: https://wolfstar.rocks

      - name: 🖥️ Test project (browser)
        run: vp run test:browser:prebuilt

      - name: ⬆︎ Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          disable_search: true
          files: test-report.junit.xml
          flags: browser
          report_type: test_results
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  a11y:
    name: ♿ Accessibility audit
    runs-on: ubuntu-latest # See https://github.com/GoogleChrome/lighthouse/discussions/16834
    timeout-minutes: 30
    strategy:
      matrix:
        mode: [dark, light]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: lts/*
          cache: true
          sfw: true

      - name: 🔼 Generate Prisma Client
        run: vp run prisma:generate

      - name: 🏗️ Build project
        run: vp run build:test
        env:
          NUXT_PUBLIC_SITE_URL: https://wolfstar.rocks

      - name: ♿ Accessibility audit (Lighthouse - ${{ matrix.mode }} mode)
        run: vp run test:a11y:prebuilt
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          LIGHTHOUSE_COLOR_MODE: ${{ matrix.mode }}

  perf:
    name: ⚡ Performance
    runs-on: ubuntu-latest # See https://github.com/GoogleChrome/lighthouse/discussions/16834
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: lts/*
          cache: true
          sfw: true

      - name: 🔼 Generate Prisma Client
        run: vp run prisma:generate

      - name: 🏗️ Build project
        run: vp run build:test
        env:
          NUXT_PUBLIC_SITE_URL: https://wolfstar.rocks

      - name: ⚡ Performance audit (Lighthouse)
        run: vp run test:perf:prebuilt
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  worker:
    name: ☁️ Worker build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: lts/*
          cache: true
          sfw: true

      - name: 🔼 Generate Prisma Client
        run: vp run prisma:generate

      - name: 🏗️ Build the production Worker
        run: vp run build
        env:
          NITRO_PRESET: cloudflare_module
          CLOUDFLARE_WORKER: production
          CLOUDFLARE_HYPERDRIVE_ID: "00000000000000000000000000000000"
          NODE_OPTIONS: --max-old-space-size=8192
          NUXT_BETTER_AUTH_SECRET: only-for-the-prerender-of-this-check
          NUXT_OAUTH_DISCORD_CLIENT_ID: "0"

      - name: ☁️ Check the Worker can be deployed
        run: npx --yes wrangler@4.156.0 deploy --dry-run -c .output/server/wrangler.json --autoconfig=false

  knip:
    name: 🧹 Unused code check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: lts/*
          cache: true
          sfw: true

      - name: 🧹 Check for unused code
        run: vp run knip

  # .skills/skilld.json declares every agent skill by exact source commit. The
  # check fails when the installed copies or the lock drift from it, and never
  # fetches remote bytes.
  skills:
    name: 🧩 Declared skills
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: lts/*
          sfw: true
          # root only, no scripts
          run-install: |
            - args: ["--filter", ".", "--ignore-scripts"]

      - name: 🧩 Check declared skills
        run: vp run skills:check

  i18n:
    name: 🌐 i18n validation
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: lts/*
          sfw: true
          # root only, no scripts
          run-install: |
            - args: ["--filter", ".", "--ignore-scripts"]

      - name: 🌐 Check for missing or dynamic i18n keys
        run: vp run i18n:report

      - name: 🌐 Check i18n schema is up to date
        run: |
          vp run i18n:schema
          git diff --exit-code i18n/schema.json i18n/schemas i18n/locales
