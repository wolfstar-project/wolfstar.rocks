name: ci

on:
  pull_request:
    branches:
      - main
      - release
  push:
    branches:
      - main
  merge_group:
    branches:
      - main

# cancel in-progress runs on new commits to same PR (gitub.event.number)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: 🔠 Lint project
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@143f5f385f39b1b753ffed1a01ad443811855c8b # v1.16.1
        with:
          node-version: lts/*
          sfw: true
          # root only, no scripts
          run-install: |
            - args: ['--filter', '.', '--ignore-scripts']

      - name: 🔠 Lint project
        run: vp run lint

  typecheck:
    name: 🔎 Typecheck project
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@143f5f385f39b1b753ffed1a01ad443811855c8b # v1.16.1
        with:
          node-version: lts/*
          cache: true
          sfw: true

      - name: 🔼 Generate Prisma Client
        run: vp run prisma:generate

      - name: 🔎 Typecheck project
        run: vp run typecheck

  unit:
    name: 🧪 Unit tests
    runs-on: ubuntu-24.04-arm
    env:
      # Match package.json test scripts; CI calls `vp test` directly.
      TEST: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@143f5f385f39b1b753ffed1a01ad443811855c8b # v1.16.1
        with:
          node-version: lts/*
          cache: true
          sfw: true

      - name: 🧪 Unit tests
        run: vp test --project unit --coverage --reporter=default --reporter=junit --outputFile=test-report.junit.xml

      - name: ⬆︎ Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          disable_search: true
          files: test-report.junit.xml
          flags: unit
          report_type: test_results
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: ⬆︎ Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          disable_search: true
          files: coverage/clover.xml
          flags: unit
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test:
    name: 🧪 Component tests
    runs-on: ubuntu-24.04-arm
    env:
      # Match package.json test scripts; CI calls `vp test` directly.
      TEST: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@143f5f385f39b1b753ffed1a01ad443811855c8b # v1.16.1
        with:
          node-version: lts/*
          cache: true
          sfw: true

      - name: 🌐 Install browser
        run: vp exec playwright install --with-deps chromium-headless-shell

      - name: 🔼 Generate Prisma Client
        run: vp run prisma:generate

      # Vitest browser-playwright occasionally drops the Chromium session mid-suite
      # (`Browser connection was closed` / `route.fulfill: Route is already handled!`)
      # after most or all assertions already passed. Retry the whole project so files
      # interrupted by the provider flake still run.
      - name: 🧪 Component tests
        run: |
          set -euo pipefail
          max_attempts=2
          attempt=1
          until vp test --project nuxt --coverage --reporter=default --reporter=junit --outputFile=test-report.junit.xml; do
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              exit 1
            fi
            echo "::warning::Component tests failed (attempt ${attempt}/${max_attempts}); retrying after Vitest browser flake"
            attempt=$((attempt + 1))
            sleep 5
          done
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: ⬆︎ Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          disable_search: true
          files: test-report.junit.xml
          flags: component
          report_type: test_results
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: ⬆︎ Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          disable_search: true
          files: coverage/clover.xml
          flags: component
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  browser:
    name: 🖥️ Browser tests
    runs-on: ubuntu-24.04-arm
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@143f5f385f39b1b753ffed1a01ad443811855c8b # v1.16.1
        with:
          node-version: lts/*
          cache: true
          sfw: true

      - name: 🔼 Generate Prisma Client
        run: vp run prisma:generate

      - name: 🏗️ Build project
        run: vp run build:test
        env:
          VALIDATE_HTML: true
          NODE_OPTIONS: --max-old-space-size=4096
          NUXT_PUBLIC_SITE_URL: https://wolfstar.rocks

      - name: 🖥️ Test project (browser)
        run: vp run test:browser:prebuilt

      - name: ⬆︎ Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          disable_search: true
          files: test-report.junit.xml
          flags: browser
          report_type: test_results
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  benchmark:
    name: ⚡ Benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@143f5f385f39b1b753ffed1a01ad443811855c8b # v1.16.1
        with:
          node-version: lts/*
          cache: true
          sfw: true

      - name: ⚡ Run benchmarks
        uses: CodSpeedHQ/action@f22792bfac16f3e14eb9fbea76f4a48e9cc22b93 # v4.19.1
        with:
          mode: simulation
          run: vp run test:bench

  a11y:
    name: ♿ Accessibility audit
    runs-on: ubuntu-latest # See https://github.com/GoogleChrome/lighthouse/discussions/16834
    strategy:
      matrix:
        mode: [dark, light]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@143f5f385f39b1b753ffed1a01ad443811855c8b # v1.16.1
        with:
          node-version: lts/*
          cache: true
          sfw: true

      - name: 🔼 Generate Prisma Client
        run: vp run prisma:generate

      - name: 🏗️ Build project
        run: vp run build:test
        env:
          NUXT_PUBLIC_SITE_URL: https://wolfstar.rocks

      - name: ♿ Accessibility audit (Lighthouse - ${{ matrix.mode }} mode)
        run: vp run test:a11y:prebuilt
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          LIGHTHOUSE_COLOR_MODE: ${{ matrix.mode }}

  perf:
    name: ⚡ Performance
    runs-on: ubuntu-latest # See https://github.com/GoogleChrome/lighthouse/discussions/16834

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@143f5f385f39b1b753ffed1a01ad443811855c8b # v1.16.1
        with:
          node-version: lts/*
          cache: true
          sfw: true

      - name: 🔼 Generate Prisma Client
        run: vp run prisma:generate

      - name: 🏗️ Build project
        run: vp run build:test
        env:
          NUXT_PUBLIC_SITE_URL: https://wolfstar.rocks

      - name: ⚡ Performance audit (Lighthouse)
        run: vp run test:perf:prebuilt
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  knip:
    name: 🧹 Unused code check
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@143f5f385f39b1b753ffed1a01ad443811855c8b # v1.16.1
        with:
          node-version: lts/*
          cache: true
          sfw: true

      - name: 🧹 Check for unused code
        run: vp run knip

  i18n:
    name: 🌐 i18n validation
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@143f5f385f39b1b753ffed1a01ad443811855c8b # v1.16.1
        with:
          node-version: lts/*
          sfw: true
          # root only, no scripts
          run-install: |
            - args: ["--filter", ".", "--ignore-scripts"]

      - name: 🌐 Check for missing or dynamic i18n keys
        run: vp run i18n:report

      - name: 🌐 Check i18n schema is up to date
        run: |
          vp run i18n:schema
          git diff --exit-code i18n/schema.json i18n/schemas i18n/locales
