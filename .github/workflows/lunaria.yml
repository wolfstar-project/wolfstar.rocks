name: lunaria

on:
  pull_request_target:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lunaria-overview:
    name: 🌝 Generate Lunaria Overview
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: write # post Lunaria overview comments on pull requests

    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Necessary for Lunaria to work properly
          # Makes the action clone the entire git history
          fetch-depth: 0
          persist-credentials: false

      # pull_request_target checks out the base branch by default. Keep the
      # executable config and dependencies trusted, but overlay the PR's locale
      # JSON so Lunaria evaluates the translations that would actually merge.
      - name: Checkout PR locale data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: .lunaria-pr
          sparse-checkout: i18n/locales
          fetch-depth: 1
          persist-credentials: false

      - name: Use PR locale data
        run: rsync --archive --delete .lunaria-pr/i18n/locales/ i18n/locales/

      # A PR that introduces a brand-new tracked locale file (e.g. a new i18n
      # feature file) has no history in this checkout: the base branch never
      # had it, and the rsync overlay above only touches the working tree, not
      # the index. Lunaria's source-file lookup needs `git log` to return at
      # least one commit or it hard-fails with "no commits have been found".
      # This commit is local to the ephemeral runner and is never pushed.
      - name: Commit PR locale overlay for Lunaria
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add i18n/locales
          git diff --cached --quiet || git commit --quiet -m "chore: overlay PR locale data for Lunaria (ephemeral, not pushed)"

      - uses: voidzero-dev/setup-vp@143f5f385f39b1b753ffed1a01ad443811855c8b # v1.16.1
        with:
          node-version: lts/*
          cache: true
          sfw: true

      - name: Generate Lunaria Overview
        uses: lunariajs/action@a0594f1c5b8d55fb367d8df607d5e2541c99e77d # v1-prerelease
