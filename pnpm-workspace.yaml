packages: []

allowBuilds:
    "@google/genai": false
    "@parcel/watcher": false
    "@prisma/client": true
    "@prisma/engines": true
    "@sentry/cli": false
    "@tailwindcss/oxide": true
    better-sqlite3: true
    core-js: false
    esbuild: false
    msgpackr-extract: false
    msw: true
    onnxruntime-node: false
    prisma: true
    protobufjs: false
    sharp: true
    unrs-resolver: false
    vue-demi: false
    workerd: false

catalogs:
    msw:
        msw: ^2.15.0

    storybook:
        "@storybook-vue/nuxt": 9.1.0-29411911.f34c865
        "@storybook/addon-a11y": ^10.5.4
        "@storybook/addon-docs": ^10.5.4
        "@storybook/addon-themes": ^10.5.4
        msw-storybook-addon: ^2.0.7
        storybook: ^10.5.4

    vite-plus:
        vite: npm:@voidzero-dev/vite-plus-core@0.2.8
        vite-plus: 0.2.7
        vitest: 4.1.10
        "@vitest/browser-playwright": 4.1.10
        "@vitest/coverage-v8": 4.1.10
        "@vitest/ui": 4.1.10

dedupePeers: true

# Prisma client resolution + Sentry OpenTelemetry instrumentation loaders
hoistPattern:
    - "*prisma*"
publicHoistPattern:
    - "*import-in-the-middle*"
    - "*require-in-the-middle*"
shamefullyHoist: true

minimumReleaseAgeExclude:
    - "@nuxt/*"
    - "@nuxtjs/*"
    - nuxt
    - nuxt-*
    - "@unhead/*"
    - unhead
    - "@voidzero-dev/*"
    - vite-plus

overrides:
    "@netlify/api": ^15.1.2
    # Keep a single discord-api-types instance; two copies make structurally
    # identical Discord payload types nominally incompatible during typecheck
    discord-api-types: 0.38.52
    # Keep one unhead version (Nuxt 4.x still ships unhead/legacy) so Nitro cannot link the
    # server bundle to a different traced package copy that omits legacy.mjs.
    "@unhead/vue": 3.4.2
    "@unhead/bundler": 3.4.2
    unhead: 3.4.2
    sharp: 0.35.3
    # prisma-orm-extension-typed-json is only published for rc.5: run it on the rc.13 packs the
    # contract needs, exactly as the bot does (wolfstar-project/wolfstar, V7).
    prisma-orm-extension-typed-json>@prisma/orm-family-sql: 8.0.0-rc.13
    prisma-orm-extension-typed-json>@prisma/orm-framework: 8.0.0-rc.13
    "@prisma/orm-target-postgres": 8.0.0-rc.13
    typescript: npm:typescript-native-bridge@6.0.3-bridge.10.tsgo.7.0.2
    vite: catalog:vite-plus
    vitest: catalog:vite-plus

savePrefix: ""

shellEmulator: true

# `@i18n-micro/path-strategy`: with the `no_prefix` strategy a language switch
# keeps the current path. Upstream navigates to the route by name, which turned
# an alias such as "/" into "/wolfstar" (see modules/i18n-no-prefix-aliases.ts).
# nuxt-seo-utils' absoluteImageUrls plugin declares its `tags:resolve` hook
# `async` with no await; unhead v3 ignores the promise and warns in dev
# ("promise ignored: tags:resolve"). The patch drops the `async`.
# nitropack: a cached function shares the call already running for a key with
# the callers that come meanwhile. On Cloudflare Workers the runtime cancels
# those callers as hung, so there the patch lets each call run on its own (see
# docs/arch/cloudflare-workers.md).
patchedDependencies:
    "@i18n-micro/path-strategy@1.3.10": patches/@i18n-micro__path-strategy@1.3.10.patch
    nitropack@2.13.4: patches/nitropack@2.13.4.patch
    nuxt-seo-utils@8.3.3: patches/nuxt-seo-utils@8.3.3.patch
    prisma-orm-extension-typed-json: patches/prisma-orm-extension-typed-json.patch
