name: release-tag

on:
  push:
    branches:
      - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  tag:
    name: 🏷️ Tag release and create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'wolfstar-project/wolfstar.rocks'
    permissions:
      contents: write # create release tags and GitHub releases
    outputs:
      version: ${{ steps.version.outputs.next }}
      from: ${{ steps.version.outputs.from }}
      skipped: ${{ steps.check.outputs.skip }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: voidzero-dev/setup-vp@143f5f385f39b1b753ffed1a01ad443811855c8b # v1.16.1
        with:
          node-version: lts/*
          run-install: false

      - name: 🔢 Determine next version
        id: version
        run: |
          VERSION_JSON=$(node scripts/next-version.ts)
          echo "current=$(echo "$VERSION_JSON" | jq -r .current)" >> "$GITHUB_OUTPUT"
          echo "next=v$(echo "$VERSION_JSON" | jq -r .next)" >> "$GITHUB_OUTPUT"
          echo "from=$(echo "$VERSION_JSON" | jq -r .from)" >> "$GITHUB_OUTPUT"
          echo "Bumping from v$(echo "$VERSION_JSON" | jq -r .current) to v$(echo "$VERSION_JSON" | jq -r .next)"

      - name: 🔍 Check if tag already exists
        id: check
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tag $VERSION already exists, skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🏷️ Create and push tag
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      # setup-vp runs twice in this job by design: the first call (run-install: false)
      # only provisions the toolchain so the version/tag steps can run, and this second
      # call performs the sfw-guarded dependency install, gated on a new tag actually
      # being created. node-version is inherited from the first call (both default to
      # the latest LTS).
      - name: 📦 Install dependencies
        if: steps.check.outputs.skip == 'false'
        uses: voidzero-dev/setup-vp@143f5f385f39b1b753ffed1a01ad443811855c8b # v1.16.1
        with:
          sfw: true
          run-install: |
            - args: ['--filter', '.', '--ignore-scripts']

      - name: 📝 Generate release notes
        if: steps.check.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FROM_REF: ${{ steps.version.outputs.from }}
        run: node scripts/release-notes.ts "$FROM_REF" > /tmp/release-notes.md

      - name: 🚀 Create GitHub Release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          gh release create "$VERSION" \
            --notes-file /tmp/release-notes.md \
            --title "$VERSION"

  # The Pullfrog agent drafts the Discord announcement from the pull requests in
  # this release, with the After screenshot of the PR evidence comments, and the
  # post job sends it once a maintainer approves the environment.
  announce-draft:
    name: ✍️ Draft the announcement
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: tag
    if: needs.tag.outputs.skipped == 'false'
    permissions:
      contents: read
      pull-requests: read # pull request bodies and PR evidence comments
      id-token: write # Pullfrog authenticates with OIDC
    outputs:
      skipped: ${{ steps.announce.outputs.skipped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ✍️ Draft
        id: announce
        uses: wolfstar-project/stars-components/.github/actions/announce@main
        with:
          mode: draft
          kind: site
          product: wolfstar.rocks
          version: ${{ needs.tag.outputs.version }}
          from-ref: ${{ needs.tag.outputs.from }}
          to-ref: ${{ needs.tag.outputs.version }}
          stage: ${{ vars.ANNOUNCE_STAGE || 'preview' }}
          format: auto
          output-dir: ${{ runner.temp }}/announcement
          role-id: ${{ vars.DISCORD_ANNOUNCEMENTS_ROLE_ID }}
          button-label: Open wolfstar.rocks
          button-url: https://wolfstar.rocks
          release-url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.tag.outputs.version }}
          callback-url: ${{ secrets.RELEASE_WEBHOOK_URL }}
          callback-secret: ${{ secrets.RELEASE_WEBHOOK_SECRET }}
        env:
          # Pullfrog reads the provider key; add the one this repository uses.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: 📦 Keep the draft for the post job
        if: steps.announce.outputs.skipped != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: announcement
          path: ${{ runner.temp }}/announcement
          retention-days: 7

  announce-post:
    name: 📣 Post to Discord
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: announce-draft
    if: needs.announce-draft.outputs.skipped != 'true'
    # Add required reviewers to this environment: the run waits here until one
    # of them reads the preview in the draft job summary and approves.
    environment: discord-announcements
    permissions:
      contents: read
    steps:
      - name: 📥 Download the draft
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: announcement
          path: ${{ runner.temp }}/announcement

      - name: 📣 Post
        uses: wolfstar-project/stars-components/.github/actions/announce@main
        with:
          mode: post
          output-dir: ${{ runner.temp }}/announcement
          webhook-url: ${{ secrets.DISCORD_ANNOUNCEMENTS_WEBHOOK_URL }}
          callback-url: ${{ secrets.RELEASE_WEBHOOK_URL }}
          callback-secret: ${{ secrets.RELEASE_WEBHOOK_SECRET }}
