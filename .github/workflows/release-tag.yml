name: release-tag

on:
  push:
    branches:
      - release

permissions: {}

jobs:
  tag:
    name: 🏷️ Tag release and create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'wolfstar-project/wolfstar.rocks'
    # Only the tagging is cancelled by a newer push. The announcement below can
    # wait days for an approval, and a newer release must not cancel it.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write # create release tags and GitHub releases
    outputs:
      version: ${{ steps.version.outputs.next }}
      from: ${{ steps.version.outputs.from }}
      skipped: ${{ steps.check.outputs.skip }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: lts/*
          run-install: false

      - name: 🔢 Determine next version
        id: version
        run: |
          VERSION_JSON=$(node scripts/next-version.ts)
          echo "current=$(echo "$VERSION_JSON" | jq -r .current)" >> "$GITHUB_OUTPUT"
          echo "next=v$(echo "$VERSION_JSON" | jq -r .next)" >> "$GITHUB_OUTPUT"
          echo "from=$(echo "$VERSION_JSON" | jq -r .from)" >> "$GITHUB_OUTPUT"
          echo "Bumping from v$(echo "$VERSION_JSON" | jq -r .current) to v$(echo "$VERSION_JSON" | jq -r .next)"

      - name: 🔍 Check if tag already exists
        id: check
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tag $VERSION already exists, skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🏷️ Create and push tag
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      # setup-vp runs twice in this job by design: the first call (run-install: false)
      # only provisions the toolchain so the version/tag steps can run, and this second
      # call performs the sfw-guarded dependency install, gated on a new tag actually
      # being created. node-version is inherited from the first call (both default to
      # the latest LTS).
      - name: 📦 Install dependencies
        if: steps.check.outputs.skip == 'false'
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          sfw: true
          run-install: |
            - args: ['--filter', '.', '--ignore-scripts']

      - name: 📝 Generate release notes
        if: steps.check.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FROM_REF: ${{ steps.version.outputs.from }}
        run: node scripts/release-notes.ts "$FROM_REF" > /tmp/release-notes.md

      - name: 🚀 Create GitHub Release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          gh release create "$VERSION" \
            --notes-file /tmp/release-notes.md \
            --title "$VERSION"

  # The agent drafts the Discord announcement from the pull requests in this
  # release, with the After screenshot of their PR evidence comments, and the
  # post job waits on the discord-announcements environment: add required
  # reviewers to it, they read the preview in the draft job summary and approve.
  announce:
    name: 📣 Announce
    needs: tag
    if: needs.tag.outputs.skipped == 'false'
    concurrency:
      group: ${{ github.workflow }}-announce-${{ needs.tag.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read # pull request bodies and PR evidence comments
      id-token: write # Pullfrog authenticates with OIDC
    uses: wolfstar-project/.github/.github/workflows/reusable-announce-release.yml@main
    with:
      kind: site
      product: wolfstar.rocks
      version: ${{ needs.tag.outputs.version }}
      from-ref: ${{ needs.tag.outputs.from }}
      to-ref: ${{ needs.tag.outputs.version }}
      stage: ${{ vars.ANNOUNCE_STAGE || 'preview' }}
      role-id: ${{ vars.DISCORD_ANNOUNCEMENTS_ROLE_ID }}
      button-label: Open wolfstar.rocks
      button-url: https://wolfstar.rocks
      release-url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.tag.outputs.version }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_ANNOUNCEMENTS_WEBHOOK_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      RELEASE_WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
      RELEASE_WEBHOOK_SECRET: ${{ secrets.RELEASE_WEBHOOK_SECRET }}
