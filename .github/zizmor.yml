# Existing privileged PR automation is intentionally isolated to these workflows:
# they do not checkout pull request head code, and they only comment or set status.
rules:
  stale-action-refs:
    ignore:
      # lunariajs/action has no tag refs; keep the branch commit hash-pinned.
      - lunaria.yml:68
  dangerous-triggers:
    ignore:
      - enforce-release-source.yml
      - lunaria.yml
      - semantic-pull-requests.yml
  # The shared announce action follows the default branch of stars-components
  # on purpose, so a fix to it reaches every repository that posts announcements.
  # Everything else stays pinned to a commit.
  unpinned-uses:
    config:
      policies:
        "wolfstar-project/stars-components/*": ref-pin
        "*": hash-pin
