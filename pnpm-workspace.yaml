packages: []

allowBuilds:
    "@google/genai": false
    "@parcel/watcher": false
    "@prisma/client": true
    "@prisma/engines": true
    "@sentry/cli": false
    "@tailwindcss/oxide": true
    better-sqlite3: true
    core-js: false
    esbuild: false
    msgpackr-extract: false
    msw: true
    nuxt-i18n-micro: false
    onnxruntime-node: false
    prisma: true
    protobufjs: false
    sharp: true
    unrs-resolver: false
    vue-demi: false
    workerd: false

catalogs:
    msw:
        msw: ^3.0.5

    storybook:
        "@storybook-vue/nuxt": 10.0.3
        "@storybook/addon-a11y": ^10.6.7
        "@storybook/addon-docs": ^10.6.7
        "@storybook/addon-themes": ^10.6.7
        msw-storybook-addon: ^3.0.3
        storybook: ^10.6.7

    vite-plus:
        vite: npm:@voidzero-dev/vite-plus-core@0.3.3
        vite-plus: 0.3.3
        vitest: 4.1.11
        "@vitest/browser-playwright": 4.1.11
        "@vitest/coverage-v8": 4.1.11
        "@vitest/ui": 4.1.11

dedupePeers: true

# Prisma client resolution + Sentry OpenTelemetry instrumentation loaders
hoistPattern:
    - "*prisma*"
publicHoistPattern:
    - "*import-in-the-middle*"
    - "*require-in-the-middle*"
shamefullyHoist: true

minimumReleaseAgeExclude:
    - "@nuxt/*"
    - "@nuxtjs/*"
    - nuxt
    - nuxt-*
    - "@unhead/*"
    - unhead
    - "@voidzero-dev/*"
    - vite-plus
    - nitropack@2.13.6 || 2.14.0
    - unrouting@0.3.2

overrides:
    # Keep a single discord-api-types instance; two copies make structurally
    # identical Discord payload types nominally incompatible during typecheck
    discord-api-types: 0.38.58
    # @nuxt/content imports h3 only in its server runtime, which Nuxt 5's
    # `nitroLegacy.h3` resolves to its h3 v1 shim whatever the version. Its types
    # must name h3 v2's event, the one server code hands it.
    "@nuxt/content>h3": ^2.0.8
    # Keep one unhead version (Nuxt 4.x still ships unhead/legacy) so Nitro cannot link the
    # server bundle to a different traced package copy that omits legacy.mjs.
    "@unhead/vue": 3.4.3
    "@unhead/bundler": 3.4.3
    unhead: 3.4.3
    sharp: 0.35.5
    # prisma-orm-extension-typed-json is only published for rc.5: run it on the rc.13 packs the
    # contract needs, exactly as the bot does (wolfstar-project/wolfstar, V7).
    prisma-orm-extension-typed-json>@prisma/orm-family-sql: 8.0.0-rc.13
    prisma-orm-extension-typed-json>@prisma/orm-framework: 8.0.0-rc.13
    "@prisma/orm-target-postgres": 8.0.0-rc.13
    typescript: npm:typescript-native-bridge@6.0.3-bridge.19.tsgo.7.0.2
    vite: catalog:vite-plus
    vitest: catalog:vite-plus

savePrefix: ""

shellEmulator: true

# `@i18n-micro/path-strategy`: with the `no_prefix` strategy a language switch
# keeps the current path. Upstream navigates to the page by name, which turned
# an alias such as "/" into "/wolfstar" (see modules/i18n-no-prefix-aliases.ts).
# ocache (the cache under Nitro v3): a cached function shares the call already
# running for a key with the callers that come meanwhile. On Cloudflare Workers
# the runtime cancels those callers as hung, so there the patch lets each call
# run on its own (see docs/arch/cloudflare-workers.md).
# nuxt-i18n-micro: in production it reads the dictionaries from `public/` one
# level above its own file, but Nitro v3 bundles it deeper below `server/`, so
# server-rendered pages showed raw keys. The patch walks up to the `public/`
# that holds them.
# @nuxt/test-utils: it picks the h3 of `registerEndpoint` from
# `@nuxt/nitro-server`, Nitro v2's, but Nuxt 4.7 builds with Nitro v3 once the
# app depends on `nitro`. The patch looks for `nitro` from the app first, so the
# stubbed endpoints get h3 v2's event, as the server code does.
patchedDependencies:
    "@nuxt/test-utils@4.4.0": patches/@nuxt__test-utils@4.4.0.patch
    nuxt-studio@1.8.2: patches/nuxt-studio@1.8.2.patch
    "@i18n-micro/path-strategy@2.1.0": patches/@i18n-micro__path-strategy@2.1.0.patch
    nuxt-i18n-micro@4.1.3: patches/nuxt-i18n-micro@4.1.3.patch
    ocache@0.3.2: patches/ocache@0.3.2.patch
    prisma-orm-extension-typed-json: patches/prisma-orm-extension-typed-json.patch
