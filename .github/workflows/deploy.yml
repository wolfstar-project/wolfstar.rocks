name: deploy

on:
  push:
    branches:
      - release

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  production:
    name: 🚀 Deploy to Cloudflare Workers
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: github.repository == 'wolfstar-project/wolfstar.rocks'
    environment: release
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version shown on the site and Lunaria's status read the history and the tags.
          fetch-depth: 0
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: lts/*
          cache: true
          sfw: true

      - name: 🔼 Generate Prisma Client
        run: vp run prisma:generate

      - name: 🌐 Build Lunaria
        run: vp run build:lunaria

      - name: 🏗️ Build the Worker
        run: vp run build
        env:
          NITRO_PRESET: cloudflare_module
          CLOUDFLARE_WORKER: production
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
          NODE_OPTIONS: --max-old-space-size=8192
          # og-image signs its URLs with Nuxt's appSecret, and its strict mode is on only
          # when the build has one: the Worker's secret of the same name must match.
          NUXT_APP_SECRET: ${{ secrets.NUXT_APP_SECRET }}
          NUXT_BETTER_AUTH_SECRET: ${{ secrets.NUXT_BETTER_AUTH_SECRET }}
          NUXT_OAUTH_DISCORD_CLIENT_ID: ${{ vars.NUXT_OAUTH_DISCORD_CLIENT_ID }}
          NUXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NUXT_PUBLIC_TURNSTILE_SITE_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SKEW_PROTECTION_BUNDLE_ASSETS: true

      - name: 🧹 Drop the client source maps
        run: find .output/public -name '*.map' -delete

      # A gradual deployment: the build is uploaded as a new Worker version and takes
      # WORKER_ROLLOUT_PERCENTAGE of the traffic next to the version that served it all;
      # the promote job below moves it to 100%. Version affinity, set by the zone's
      # Transform Rules, keeps each visitor on one version meanwhile (see
      # docs/arch/cloudflare-workers.md). Without the variable the new version takes
      # all of it at once. The Worker's first deploy, which has no version to split
      # with and creates the custom domain, is a plain `wrangler deploy`.
      - name: 🚀 Deploy a new version
        id: deploy
        run: |
          set -euo pipefail
          wrangler() { ./node_modules/.bin/wrangler "$@"; }
          config=.output/server/wrangler.json

          # Only a Worker that has never been deployed takes the plain deploy; any other
          # failure (a token, the API) stops here rather than skip the approval.
          if ! status=$(wrangler deployments status -c "$config" --json 2>"$RUNNER_TEMP/status.err"); then
            if grep -qE 'has no deployments|\[code: 10007\]' "$RUNNER_TEMP/status.err"; then
              wrangler deploy -c "$config" --autoconfig=false
              echo "rollout=full" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$RUNNER_TEMP/status.err" >&2
            exit 1
          fi
          previous=$(jq -r '.versions | max_by(.percentage) | .version_id' <<<"$status")

          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler-output.ndjson"
          : > "$WRANGLER_OUTPUT_FILE_PATH"
          wrangler versions upload -c "$config" --tag "${GITHUB_SHA:0:12}" --message "release ${GITHUB_SHA:0:12}"
          version=$(jq -r 'select(.type == "version-upload") | .version_id' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)

          percentage="${ROLLOUT_PERCENTAGE:-100}"
          if [[ "$percentage" -ge 100 ]]; then
            wrangler versions deploy "$version@100%" -c "$config" --yes --message "release ${GITHUB_SHA:0:12}"
            echo "rollout=full" >> "$GITHUB_OUTPUT"
          else
            wrangler versions deploy "$version@$percentage%" "$previous@$((100 - percentage))%" \
              -c "$config" --yes --message "release ${GITHUB_SHA:0:12} at $percentage%"
            echo "rollout=gradual" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "version=$version"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Worker version $version at $percentage%"
            echo
            echo "Previous version: \`$previous\`. Roll back with:"
            echo
            echo "\`npx wrangler versions deploy $previous@100% --name wolfstar-rocks --yes\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ROLLOUT_PERCENTAGE: ${{ vars.WORKER_ROLLOUT_PERCENTAGE }}

    outputs:
      rollout: ${{ steps.deploy.outputs.rollout }}
      version: ${{ steps.deploy.outputs.version }}

  # Waits on the `release-promote` environment's reviewers: approving moves the new
  # version to all traffic. Rejecting leaves the split; the step summary of the
  # production job has the command that rolls back.
  promote:
    name: 📈 Promote the version to 100%
    needs: production
    if: needs.production.outputs.rollout == 'gradual'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-promote
    permissions: {}

    steps:
      - name: 📈 Promote
        run: npx --yes wrangler@4.156.0 versions deploy "$VERSION@100%" --name wolfstar-rocks --yes --message "promote ${GITHUB_SHA:0:12}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION: ${{ needs.production.outputs.version }}
