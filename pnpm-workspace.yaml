packages: []

allowBuilds:
    "@google/genai": false
    "@parcel/watcher": false
    "@prisma/client": true
    "@prisma/engines": true
    "@sentry/cli": false
    better-sqlite3: true
    core-js: false
    esbuild: false
    msw: true
    onnxruntime-node: false
    prisma: true
    protobufjs: false
    sharp: true
    unrs-resolver: false
    vue-demi: false

catalogs:
    msw:
        msw: ^2.15.0

    storybook:
        "@storybook-vue/nuxt": 9.1.0-29411911.f34c865
        "@storybook/addon-a11y": ^10.5.4
        "@storybook/addon-docs": ^10.5.4
        "@storybook/addon-themes": ^10.5.4
        msw-storybook-addon: ^2.0.7
        storybook: ^10.5.4

    vite-plus:
        vite: npm:@voidzero-dev/vite-plus-core@0.2.6
        vite-plus: 0.2.7
        vitest: 4.1.10
        "@vitest/browser-playwright": 4.1.10
        "@vitest/coverage-v8": 4.1.10
        "@vitest/ui": 4.1.10

dedupePeers: true

# Prisma client resolution + Sentry OpenTelemetry instrumentation loaders
hoistPattern:
    - "*prisma*"
publicHoistPattern:
    - "*import-in-the-middle*"
    - "*require-in-the-middle*"
shamefullyHoist: true

minimumReleaseAgeExclude:
    - "@nuxt/*"
    - "@nuxtjs/*"
    - nuxt
    - nuxt-*
    - "@unhead/*"
    - unhead
    - "@voidzero-dev/*"
    - vite-plus

overrides:
    "@netlify/api": ^14.0.19
    # Keep a single discord-api-types instance; two copies make structurally
    # identical Discord payload types nominally incompatible during typecheck
    discord-api-types: 0.38.51
    # Same reason: `Ref` and friends are nominal (symbol-branded), so two
    # vue copies make VueUse and app refs incompatible during typecheck
    vue: 3.5.40
    # Keep a single Nuxt schema/kit and vue-router hoisted at the root. Without
    # @nuxt/ui, pnpm may hoist older transitive copies so `DefineNuxtConfig`
    # loses its call signature and `prepare:types` drops `nodeReferences`.
    "@nuxt/schema": 4.5.0
    "@nuxt/kit": 4.5.0
    vue-router: 5.2.0
    sharp: 0.34.5
    typescript: npm:typescript-native-bridge@6.0.3-bridge.7.tsgo.7.0.2
    vite: catalog:vite-plus
    vitest: catalog:vite-plus

patchedDependencies:
    "@ameinhardt/unocss-preset-daisy@1.1.8": patches/@ameinhardt__unocss-preset-daisy@1.1.8.patch
    "@nuxt/test-utils": patches/@nuxt__test-utils.patch

savePrefix: ""

shellEmulator: true
