# Existing privileged PR automation is intentionally isolated to these workflows:
# they do not checkout pull request head code, and they only comment or set status.
rules:
  stale-action-refs:
    ignore:
      # lunariajs/action has no tag refs; keep the branch commit hash-pinned.
      - lunaria.yml:68
      # The org's .github repository publishes no tags; its reusable workflows
      # stay pinned to a commit hash.
      - labelsync.yml:15
      - tolgee-sync.yml:19
  dangerous-triggers:
    ignore:
      - enforce-release-source.yml
      - lunaria.yml
      - semantic-pull-requests.yml
  # The shared announce workflows follow the default branch of the org's
  # .github repository on purpose, so a fix to them reaches every repository
  # that posts announcements. Everything else stays pinned to a commit.
  unpinned-uses:
    config:
      policies:
        "wolfstar-project/.github/*": ref-pin
        "*": hash-pin
